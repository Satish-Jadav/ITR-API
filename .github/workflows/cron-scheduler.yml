name: ZeroTax API Cron Scheduler (Replaces Vercel Cron)
'on':
  schedule:
    - cron: '*/5 * * * *'
    - cron: 0 2 * * *
    - cron: 0 3 1 * *
    - cron: '0 4 1,10,14 3,6,9,12 *'
  workflow_dispatch:
    inputs:
      job_target:
        description: Which cron endpoint to trigger manually
        required: true
        default: run-all
        type: choice
        options:
          - run-all
          - portal-probe
          - statutory-sync
          - aa-periodic-pull
          - advance-tax-alerter
concurrency:
  group: 'zerotax-api-cron-${{ github.event.schedule || github.run_id }}'
  cancel-in-progress: true
jobs:
  trigger-api-cron:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    env:
      API_BASE_URL: >-
        ${{ secrets.ZEROTAX_API_BASE_URL || 'https://api-zerotax-itr.vercel.app'
        }}
      CRON_SECRET: '${{ secrets.CRON_SECRET }}'
    steps:
      - name: Determine Target Endpoint & Execute API Call
        run: |
          if [ -z "$CRON_SECRET" ]; then
            echo "::error::CRON_SECRET repository secret is not set in GitHub Actions settings."
            exit 1
          fi

          call_cron_endpoint() {
            local endpoint="$1"
            echo "Triggering POST ${API_BASE_URL}/api/v1/cron/${endpoint} ..."
            response=$(curl -sS -w "\n%{http_code}" -X POST "${API_BASE_URL}/api/v1/cron/${endpoint}" \
              -H "Authorization: Bearer ${CRON_SECRET}" \
              -H "Content-Type: application/json" \
              -H "User-Agent: ZeroTax-GitHubActions-Cron/1.0" \
              --max-time 14)
            http_body=$(echo "$response" | sed '$d')
            http_status=$(echo "$response" | tail -n 1)
            echo "Response ($http_status): $http_body"
            if [ "$http_status" -lt 200 ] || [ "$http_status" -ge 300 ]; then
              echo "::error::Cron endpoint /api/v1/cron/${endpoint} failed with HTTP status ${http_status}"
              exit 1
            fi
          }

          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            call_cron_endpoint "${{ github.event.inputs.job_target }}"
            exit 0
          fi

          case "${{ github.event.schedule }}" in
            "*/5 * * * *")
              call_cron_endpoint "portal-probe"
              ;;
            "0 2 * * *")
              call_cron_endpoint "statutory-sync"
              call_cron_endpoint "portal-probe"
              ;;
            "0 3 1 * *")
              call_cron_endpoint "aa-periodic-pull"
              ;;
            "0 4 1,10,14 3,6,9,12 *")
              call_cron_endpoint "advance-tax-alerter"
              ;;
            *)
              call_cron_endpoint "portal-probe"
              ;;
          esac
